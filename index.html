<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1ee;
    --ink: #16211c;
    --ink-soft: #5b6960;
    --accent: #1c7c74;
    --cursor: #16211c;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1613;
      --ink: #eaf2ed;
      --ink-soft: #93a89e;
      --accent: #3fd9c7;
      --cursor: #3fd9c7;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0e1613;
    --ink: #eaf2ed;
    --ink-soft: #93a89e;
    --accent: #3fd9c7;
    --cursor: #3fd9c7;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 2rem max(1.25rem, env(safe-area-inset-left, 0px));
    transition: background 0.3s ease;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
    text-align: center;
  }

  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-optical-sizing: auto;
    font-weight: 480;
    font-size: clamp(2.75rem, 13vw, 8rem);
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--ink);
    display: inline-flex;
    align-items: baseline;
    white-space: nowrap;
    cursor: default;
  }

  .cursor {
    display: inline-block;
    width: 0.06em;
    margin-left: 0.12em;
    height: 0.72em;
    background: var(--cursor);
    animation: blink 1.1s steps(1) infinite;
  }

  .caption {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(0.7rem, 1.6vw, 0.85rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .caption span {
    color: var(--accent);
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor {
      animation: none;
    }
  }

  @media (max-width: 420px) {
    h1 {
      white-space: normal;
    }
  }
</style>
</head>
<body>
  <main>
    <h1>Hello World<span class="cursor" aria-hidden="true"></span></h1>
    <p class="caption"><span>$</span> the first line every language ever asks you to write</p>
  </main>
</body>
</html>
